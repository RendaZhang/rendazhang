name: Build & Deploy Astro Site with fixed version Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mirror_run_id:
        description: 'Original deploy run for mirror-only retry; empty means a new build'
        type: string
        default: ''
      mirror_attempt:
        description: 'Original immutable artifact attempt for mirror-only retry'
        type: string
        default: '1'

permissions:
  contents: write
  actions: read

concurrency:
  group: frontend-production-transaction
  cancel-in-progress: false

env:
  TAG_NAME: ${{ vars.PUBLIC_TAG_NAME }}

jobs:
  build-and-deploy:
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Verify pinned runner runtime
        run: |
          node_bin="$(command -v node)"
          export PATH="$(dirname "$node_bin"):$PATH"
          npm_cli="$(dirname "$(dirname "$node_bin")")/lib/node_modules/npm/bin/npm-cli.js"
          test "$("$node_bin" --version)" = v24.17.0
          test "$("$node_bin" "$npm_cli" --version)" = 11.13.0
          echo "NPM_CLI=$npm_cli" >> "$GITHUB_ENV"
          /usr/bin/python3 --version
      - name: Install locked runner dependencies and browser before activation
        run: |
          node "$NPM_CLI" ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run checks and tests
        if: ${{ inputs.mirror_run_id == '' }}
        run: |
          node "$NPM_CLI" run sync
          node "$NPM_CLI" run lint
          node "$NPM_CLI" run typecheck
          node "$NPM_CLI" run check
          node "$NPM_CLI" run test:coverage
      - name: Upload coverage report
        if: ${{ inputs.mirror_run_id == '' && success() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage
      - name: Build exactly once with existing Sentry configuration
        if: ${{ inputs.mirror_run_id == '' }}
        run: |
          node "$NPM_CLI" run build
          find dist -type f -name '*.map' -delete
          echo 'Source map files removed before immutable packaging'
          /usr/bin/python3 -B scripts/release_bundle.py create --dist dist --bundle "$RUNNER_TEMP/release-bundle" --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_CDN_BASE: ${{ vars.PUBLIC_CDN_BASE }}
          PUBLIC_NODE_ENV: ${{ vars.PUBLIC_NODE_ENV }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          PUBLIC_SITE_BASE_URL: ${{ vars.PUBLIC_SITE_BASE_URL }}
          PUBLIC_TAG_NAME: ${{ env.TAG_NAME }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SKIP_SENTRY: ${{ secrets.SKIP_SENTRY }}
          SKIP_ESLINT: ${{ secrets.SKIP_ESLINT }}
      - name: Retain immutable exact-attempt retry artifact
        if: ${{ inputs.mirror_run_id == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 7
      - name: Download and bind mirror-only retry to original master workflow
        if: ${{ inputs.mirror_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_RUN_ID: ${{ inputs.mirror_run_id }}
          MIRROR_ATTEMPT: ${{ inputs.mirror_attempt }}
        run: |
          /usr/bin/python3 -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_distribution import download_retry
          download_retry(os.environ['GITHUB_REPOSITORY'], int(os.environ['MIRROR_RUN_ID']), int(os.environ['MIRROR_ATTEMPT']), Path(os.environ['RUNNER_TEMP']) / 'release-bundle')
          PY
      - name: Verify artifact and complete preview before any activation
        run: |
          /usr/bin/python3 -B scripts/release_bundle.py verify --bundle "$RUNNER_TEMP/release-bundle" --preview "$RUNNER_TEMP/release-preview"
          /usr/bin/python3 -B scripts/release_preview_check.py --bundle "$RUNNER_TEMP/release-bundle" --preview "$RUNNER_TEMP/release-preview"
      - name: Prepare private runner SSH files with reviewed host-key pin
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
        run: |
          umask 077
          directory="$RUNNER_TEMP/release-ssh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$directory"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KEY" > "$directory/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$directory/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$directory/known_hosts" > /dev/null
          echo "DEPLOY_KEY_FILE=$directory/key" >> "$GITHUB_ENV"
          echo "DEPLOY_KNOWN_HOSTS_FILE=$directory/known_hosts" >> "$GITHUB_ENV"
      - name: Guarded origin acceptance then fixed-ref artifact and CDN publication
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ORIGIN: ${{ vars.PUBLIC_SITE_BASE_URL }}
          MIRROR_RUN_ID: ${{ inputs.mirror_run_id }}
        run: |
          mode=deploy
          if [ -n "$MIRROR_RUN_ID" ]; then mode=publish; fi
          /usr/bin/python3 -B scripts/release_runner.py --bundle "$RUNNER_TEMP/release-bundle" --preview "$RUNNER_TEMP/release-preview" --mode "$mode"
      - name: Retain runner acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/personalweb-acceptance
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only this run's private SSH files
        if: ${{ always() }}
        run: |
          directory="$RUNNER_TEMP/release-ssh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -d "$directory" ]; then
            rm -f "$directory/key" "$directory/known_hosts"
            rmdir "$directory"
          fi
